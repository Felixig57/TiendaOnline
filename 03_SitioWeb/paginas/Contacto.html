<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Freeman&family=Montserrat:wght@400;500&display=swap" rel="stylesheet">
 <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Freeman&family=Rubik+Dirt&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/contactoEstilos.css">
  <title>Contacto | Grupo Molina</title>

</head>
<body>

  <header>
    <a href="../index.html">
      <img src="../imagenes/marca/logoMolina.png" alt="Logotipo de Grupo Molina">
      <span>Grupo Molina</span>
    </a>

    <nav>
      <ul>
        <li><a href="../index.html">Inicio</a></li>
        <li><a href="../paginas/Nosotros.html">Nosotros</a></li>
        <li><a href="../paginas/Catalogo.html">Uvas</a></li>
        <li><a href="../paginas/Logistica.html">Logística</a></li>
        <li><a href="../paginas/Contacto.html" class="activo">Contacto</a></li>
      </ul>
    </nav>
  </header>

  <main class="contacto">

    <img class="contacto-foto" src="../imagenes/general/FondoUvasTarjertaContacto.webp" alt="Racimo de uvas moradas en la vid dentro de un viñedo">

    <section class="contacto-formulario">
      <h1>Contáctanos</h1>

      <form action="#" method="post">

        <div>
          <label for="nombre">Nombre</label>
          <input type="text" id="nombre" name="nombre" placeholder="Nombre">
        </div>

        <div>
          <label for="email">Email *</label>
          <input type="email" id="email" name="email" placeholder="Email" required>
        </div>

        <div>
          <label for="ciudad">Ciudad y País</label>
          <input type="text" id="ciudad" name="ciudad" placeholder="Ciudad y País">
        </div>

        <fieldset>
          <legend>Departamento de donde te comunicas *</legend>

          <label>
            <input type="radio" name="departamento" value="servicio" required>
            Servicio a clientes
          </label>

          <label>
            <input type="radio" name="departamento" value="marketing">
            Marketing
          </label>

          <label>
            <input type="radio" name="departamento" value="logistica">
            Logística
          </label>

          <label>
            <input type="radio" name="departamento" value="ventas">
            Ventas
          </label>
        </fieldset>

        <div>
          <label for="mensaje">Mensaje *</label>
          <textarea id="mensaje" name="mensaje" rows="5" placeholder="Mensaje" required></textarea>
        </div>

        <button type="submit">Enviar mensaje</button>

      </form>
    </section>

  </main>

  <footer>
    <p>&copy; 2026 Grupo Molina. Uvas de mesa de Sonora, México.</p>
    <nav>
      <ul>
        <li><a href="../paginas/Nosotros.html">Nosotros</a></li>
        <li><a href="../paginas/Logistica.html">Logística</a></li>
        <li><a href="../paginas/Contacto.html">Contacto</a></li>
      </ul>
    </nav>
  </footer>

</body>
</html>
